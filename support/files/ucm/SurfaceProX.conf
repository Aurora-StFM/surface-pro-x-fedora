# ALSA UCM profile for the Microsoft Surface Pro X (SC8180X).
# The audio hardware matches the Lenovo Yoga C630 (WCD9340 + 2x WSA881x),
# so this follows ucm2/Qualcomm/sdm845/Lenovo-YOGA-C630-13Q50.conf.
Syntax 4

SectionUseCase."HiFi" {
	File "/Microsoft/SurfaceProX/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.codec-init.File "/codecs/wcd934x/init.conf"
