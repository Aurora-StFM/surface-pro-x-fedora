# Use case configuration for the Microsoft Surface Pro X.
# Based on the Lenovo Yoga C630 profile from alsa-ucm-conf.
#
# Windows protects the speakers with Qualcomm speaker protection (VI sense
# feedback). Linux doesn't, so the WSA881x amplifier gain is capped at
# 12 dB ("PA Volume" 8 of 12) instead of the C630's 18 dB.

SectionVerb {

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	Include.wcde.File "/codecs/wcd934x/DefaultEnableSeq.conf"
	Include.wsae.File "/codecs/wsa881x/DefaultEnableSeq.conf"

	Include.wcdd {
		File "/codecs/wcd934x/DefaultDisableSeq.conf"
		Before.DisableSequence "0"
	}

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia3' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wcdspke.File "/codecs/wcd934x/SpeakerEnableSeq.conf"
	Include.wcdspkd.File "/codecs/wcd934x/SpeakerDisableSeq.conf"

	EnableSequence [
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft PA Volume' 8"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight PA Volume' 8"
	]

	Include.wsaspkd.File "/codecs/wsa881x/SpeakerDisableSeq.conf"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speaker"
	}
}

# The Surface Pro X has no headphone jack. The codec's headset detection
# (MBHC) still reports a plug at boot ("MONO plug type detected"), and with a
# Headphones device here PipeWire switched to it and ran the Speaker disable
# sequence, which disconnects the speaker path (RX INT7/8 MIX1 INP0 = ZERO):
# playback ran silently. So there are no Headphones or headset Mic devices.
# The built-in microphones are still to be added.
