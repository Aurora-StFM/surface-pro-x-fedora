# Surface Pro X: the modem's EFS partitions can't be reached from Linux yet
# (linux-surface/surface-pro-x#2), so serve zero-filled dummy files instead.
# This is what the linux-surface rmtfs-dummy package does on Arch.
[Service]
ExecStartPre=/usr/libexec/surface-pro-x/rmtfs-prepare
ExecStart=
ExecStart=rmtfs -r -s -o /var/lib/rmtfs
