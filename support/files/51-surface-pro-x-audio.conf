# Surface Pro X: play to the codec in 16-bit.
#
# The audio DSP driver (q6asm) offers S16_LE and S24_LE, and PipeWire picks
# S24_LE. The Surface Pro X's DSP firmware doesn't scale 24-bit samples the
# way the driver expects: everything comes out about 48 dB (8 bits) too quiet,
# and crackly when raised. 16-bit plays at the normal level.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]
